
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks Management</h1>

        <div class="form">
            <input type="text" id="studentName" placeholder="Enter student name">

            <input type="number" id="studentMarks"
                   placeholder="Enter marks (0-100)" min="0" max="100">

            <button id="addBtn">Add Student</button>
        </div>

        <p id="message"></p>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
